name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check and build inside Docker
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          docker build --target checks -t brunya-checks .
          docker build --target build --build-arg NEXT_PUBLIC_BASE_PATH="$BASE_PATH" -t brunya-pages .
          container=$(docker create brunya-pages)
          docker cp "$container:/app/dist/client" ./pages-output
          docker rm "$container"
          touch pages-output/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
